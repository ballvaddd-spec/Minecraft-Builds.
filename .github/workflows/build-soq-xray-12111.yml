name: Build SoQ X-Ray 1.21.11

on:
  push:
    branches: [main]
    paths:
      - "resourcepacks/SoQ_XRay_1.21.11/make.py"
      - ".github/workflows/build-soq-xray-12111.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - name: Build both packs
        run: python resourcepacks/SoQ_XRay_1.21.11/make.py
      - name: Commit updated ZIP resource packs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resourcepacks/SoQ_XRay_1.21.11/*.zip
          if git diff --cached --quiet; then
            echo "ZIP files are already up to date"
          else
            git commit -m "Build SoQ X-Ray and glowing ore ZIPs for Minecraft 1.21.11"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SoQ-Glow-Ores-Minecraft-1.21.11
          path: |
            resourcepacks/SoQ_XRay_1.21.11/SoQ_XRay_GlowOres_1.21.11.zip
            resourcepacks/SoQ_XRay_1.21.11/SoQ_GlowOres_Only_1.21.11.zip
