name: Fetch Iris + Sodium 1.21.1

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fetch-iris-1.21.1.yml"

permissions:
  contents: write

jobs:
  fetch-mods:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download matching Iris and Sodium for Minecraft 1.21.1 Fabric
        shell: python
        run: |
          import json
          import pathlib
          import urllib.request

          MODS = [
              {
                  "id": "bAo1Qhte",
                  "out": "Iris_1.8.14-beta.1_MC1.21.1_Fabric.jar",
              },
              {
                  "id": "s7adptIg",
                  "out": "Sodium_0.8.12-beta.1_MC1.21.1_Fabric.jar",
              },
          ]

          out_dir = pathlib.Path("mods")
          out_dir.mkdir(exist_ok=True)

          info_lines = [
              "Minecraft 1.21.1 Fabric shader compatibility pair",
              "",
          ]

          for mod in MODS:
              api = "https://api.modrinth.com/v2/version/" + mod["id"]
              req = urllib.request.Request(api, headers={
                  "User-Agent": "ballvaddd-spec/Minecraft-Builds mod fetcher"
              })
              with urllib.request.urlopen(req, timeout=30) as r:
                  version = json.load(r)

              files = version.get("files", [])
              if not files:
                  raise RuntimeError("No downloadable files found for " + mod["id"])

              file_info = next((f for f in files if f.get("primary")), files[0])
              req = urllib.request.Request(file_info["url"], headers={
                  "User-Agent": "ballvaddd-spec/Minecraft-Builds mod fetcher"
              })
              with urllib.request.urlopen(req, timeout=60) as r:
                  data = r.read()

              out_file = out_dir / mod["out"]
              out_file.write_bytes(data)
              print("Downloaded", file_info.get("filename"), "->", out_file, len(data), "bytes")
              info_lines.append(f"{mod['out']} = {version.get('version_number')}")

          info_lines += [
              "",
              "Iris source: https://modrinth.com/mod/iris",
              "Sodium source: https://modrinth.com/mod/sodium",
              "Iris license: LGPL-3.0-only",
              "Install BOTH jar files together and remove the old Iris/Sodium jars first.",
          ]
          (out_dir / "IRIS_SODIUM_INFO.txt").write_text(
              "\n".join(info_lines) + "\n",
              encoding="utf-8",
          )

      - name: Commit mods to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/Iris_1.8.14-beta.1_MC1.21.1_Fabric.jar
          git add mods/Sodium_0.8.12-beta.1_MC1.21.1_Fabric.jar
          git add mods/IRIS_SODIUM_INFO.txt
          if git diff --cached --quiet; then
            echo "Mods are already up to date."
          else
            git commit -m "Add compatible Iris and Sodium for Minecraft 1.21.1"
            git push
          fi
