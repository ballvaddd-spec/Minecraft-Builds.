name: Build Royal Rags 3D

on:
  push:
    paths:
      - 'RoyalRags3DMod/**'
      - '.github/workflows/build-royal-rags.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: royal-rags-3d-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RoyalRags3DMod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: python3 tools/generate_textures.py
      - run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Royal-Rags-3D-1.21.1
          path: RoyalRags3DMod/build/libs/*.jar
      - name: Publish ready jar to repository root
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          cp RoyalRags3DMod/build/libs/royal-rags-3d-1.21.1-2.0.0.jar Royal_Rags_3D_1.21.1_DETAILED.jar
          git add Royal_Rags_3D_1.21.1_DETAILED.jar
          if git diff --cached --quiet; then
            echo "Ready jar is already current"
          else
            git commit -m "Publish detailed Royal Rags 3D jar"
            git push
          fi
